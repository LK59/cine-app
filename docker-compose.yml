networks:
  media_net:
    external: true

services:
  cine-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cine-app:latest
    container_name: cine-app
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
    volumes:
      # Dossier média principal (lecture seule)
      - /mnt/media/video:/mnt/media/video:ro

      # Base de données persistante de l'app
      - ./data:/app/data

      # Galerie photo Clara Galle — requis si CLARA_GALLERY_ENABLED=true
      # Voir docker-compose.example.yml et la section README pour le contenu attendu
      - /mnt/media/cloud/louis/clara:/app/gallery/clara:ro
    # Décommenter pour tester un accès direct sans reverse proxy :
    # ports:
    #   - "3000:3000"
    networks:
      - media_net
    restart: unless-stopped
