# CineApp — the minimal deployment.
#
#   docker compose up -d     then open http://<server>:3000
#
# A first-launch assistant asks for the rest in the browser: an administrator account, then
# Jellyfin, TMDB and Radarr/Sonarr (the only required services), and optionally Jellyseerr,
# qBittorrent, Bazarr, Jackett and ratings. Secrets are generated on first launch and kept in the
# data volume. No .env is needed.
#
# Optional extras (time zone, a media folder for storage statistics, a shared Docker network,
# resource limits, a reverse proxy) are described in QUICKSTART.md and DEPLOYMENT.md.
services:
  cine-app:
    image: ghcr.io/lk59/cine-app:latest
    ports:
      - "3000:3000"
    volumes:
      - cine-data:/app/data
    restart: unless-stopped

volumes:
  cine-data:
