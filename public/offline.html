<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Laterna</title>
<!--
  La page « Pas de connexion », servie par le service worker quand une navigation échoue.

  Tout est ici, sans rien charger d'autre : elle s'affiche justement quand le serveur ne répond pas,
  et elle fait partie des ACTIFS_PUBLICS du proxy (servie sans session) — un fichier qu'elle
  demanderait devrait l'être aussi.

  15/10/2026 (passe de nuit, ROBUSTESSE-4/5, décision de Louis) : elle ne revenait pas seule au
  retour du réseau — il fallait toucher « Réessayer » —, elle était en français pour tout le monde,
  et sur le fond bleu ardoise d'une ancienne version. Elle parle maintenant la langue de l'app (le
  cookie cine-lang) ou du navigateur, en noir et blanc, et se recharge d'elle-même dès que le
  serveur répond vraiment : un événement « online » ne suffit pas (le Wi-Fi peut revenir sans le
  serveur), la page interroge /api/ping — publique, sans cookie, que le service worker ne
  retient pas — et ne se recharge que sur une réponse 200. Pas de boucle : rien ne recharge tant
  que la sonde échoue.

  19/10/2026 (DECISIONS.md §109) : un bouton « Accéder aux téléchargements » mène à `/hors-ligne`,
  l'entrée hors ligne que le service worker garde sur un appareil qui a des téléchargements — montré
  seulement si elle est là (`caches.match`). Et un second mode, « attente » (`data-attente` posé par
  le worker sur <html>) : la navigation n'a pas échoué, elle tarde. La page demande alors au worker
  (`/__sw/attente`) de la prévenir quand la réponse arrive, et se recharge pour la recevoir telle
  quelle ; si la navigation échoue finalement, elle redevient la page « Pas de connexion ».
-->
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    min-height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
    text-align: center;
  }
  h1 { font-size: 1.125rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  p { font-size: 0.9rem; line-height: 1.5; color: #a3a3a3; margin: 0; max-width: 24rem; }
  button {
    margin-top: 0.75rem;
    border: 0;
    background: #fff;
    color: #000;
    border-radius: 9999px;
    padding: 0.7rem 1.4rem;
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .waiting { font-size: 0.75rem; color: #737373; }
  [hidden] { display: none !important; }
  .mark { margin-bottom: 0.5rem; }
  #retry.secondary { background: rgba(255, 255, 255, 0.12); color: #fff; margin-top: 0; }
  .spinner {
    width: 1.5rem; height: 1.5rem; border-radius: 9999px;
    border: 2px solid rgba(255, 255, 255, 0.2); border-top-color: #fff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <main class="wrap">
    <!-- Le logo, écrit dans la page (le glyphe de BrandMark) : cette page ne charge rien d'autre. -->
    <svg class="mark" viewBox="117 98 310 310" width="44" height="44" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="mk-beam" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0.18"/></linearGradient>
      </defs>
      <polygon points="168,290 408,222 408,402 168,346" fill="url(#mk-beam)"/>
      <rect x="136" y="104" width="60" height="242" rx="18" fill="#f5f5f4"/>
    </svg>
    <div id="spinner" class="spinner" hidden></div>
    <h1 id="title">Pas de connexion</h1>
    <p id="text">Laterna n'a pas pu joindre le serveur. Vérifiez votre connexion réseau et réessayez.</p>
    <button id="downloads" type="button" hidden>Accéder aux téléchargements</button>
    <button id="retry" type="button">Réessayer</button>
    <p id="waiting" class="waiting">La page reviendra d'elle-même dès que le serveur répondra.</p>
  </main>
<script>
  (function () {
    var TEXTS = {
      fr: {
        title: "Pas de connexion",
        text: "Laterna n'a pas pu joindre le serveur. Vérifiez votre connexion réseau et réessayez.",
        retry: "Réessayer",
        waiting: "La page reviendra d'elle-même dès que le serveur répondra.",
        downloads: "Accéder aux téléchargements",
        waitTitle: "Le serveur tarde à répondre",
        waitText: "Laterna s'ouvrira dès qu'il répondra. En attendant, vos téléchargements sont sur cet appareil."
      },
      en: {
        title: "No connection",
        text: "Laterna couldn't reach the server. Check your network connection and try again.",
        retry: "Try again",
        waiting: "This page will come back on its own as soon as the server answers.",
        downloads: "Go to downloads",
        waitTitle: "The server is slow to respond",
        waitText: "Laterna will open as soon as it answers. In the meantime, your downloads are on this device."
      },
      es: {
        title: "Sin conexión",
        text: "Laterna no ha podido contactar con el servidor. Comprueba tu conexión de red e inténtalo de nuevo.",
        retry: "Reintentar",
        waiting: "La página volverá sola en cuanto el servidor responda.",
        downloads: "Ir a las descargas",
        waitTitle: "El servidor tarda en responder",
        waitText: "Laterna se abrirá en cuanto responda. Mientras tanto, tus descargas están en este dispositivo."
      },
      de: {
        title: "Keine Verbindung",
        text: "Laterna konnte den Server nicht erreichen. Prüfen Sie Ihre Netzwerkverbindung und versuchen Sie es erneut.",
        retry: "Erneut versuchen",
        waiting: "Die Seite kommt von selbst zurück, sobald der Server antwortet.",
        downloads: "Zu den Downloads",
        waitTitle: "Der Server antwortet nur langsam",
        waitText: "Laterna öffnet sich, sobald er antwortet. Bis dahin sind Ihre Downloads auf diesem Gerät."
      }
    };

    function pickLang() {
      var m = /(?:^|;\s*)cine-lang=([a-z]{2})/.exec(document.cookie || "");
      if (m && TEXTS[m[1]]) return m[1];
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "fr"];
      for (var i = 0; i < langs.length; i++) {
        var code = String(langs[i] || "").slice(0, 2).toLowerCase();
        if (TEXTS[code]) return code;
      }
      return "fr";
    }

    var lang = pickLang();
    var t = TEXTS[lang];
    document.documentElement.lang = lang;
    document.title = "Laterna — " + t.title;
    ["title", "text", "retry", "waiting", "downloads"].forEach(function (id) {
      document.getElementById(id).textContent = t[id];
    });

    document.getElementById("retry").addEventListener("click", function () {
      location.reload();
    });

    // L'entrée hors ligne des téléchargements, si le service worker la garde (un appareil qui a des
    // téléchargements) : sinon le bouton mènerait à une page qui ne s'ouvre pas. Elle devient alors
    // le bouton principal, « Réessayer » passe en second.
    var downloadsButton = document.getElementById("downloads");
    downloadsButton.addEventListener("click", function () {
      location.href = "/hors-ligne";
    });
    if (typeof caches !== "undefined" && caches && caches.match) {
      caches
        .match("/hors-ligne")
        .then(function (hit) {
          if (!hit) return;
          downloadsButton.hidden = false;
          document.getElementById("retry").className = "secondary";
        })
        .catch(function () {});
    }

    // Le serveur répond-il vraiment ? Seul un 200 de /api/ping recharge la page.
    var reloading = false;
    function probe() {
      if (reloading || waitingMode) return;
      fetch("/api/ping", { cache: "no-store" })
        .then(function (res) {
          if (res.ok && !reloading) {
            reloading = true;
            location.reload();
          }
        })
        .catch(function () {});
    }
    // Le mode « attente » : la navigation tarde. La page le dit, et se recharge dès que le worker
    // a la réponse — qu'il lui rendra sans la redemander. Un échec la ramène au mode ordinaire.
    var waitingMode = document.documentElement.getAttribute("data-attente") === "1";
    function plainMode() {
      waitingMode = false;
      document.getElementById("spinner").hidden = true;
      document.getElementById("retry").hidden = false;
      document.getElementById("waiting").hidden = false;
      document.getElementById("title").textContent = t.title;
      document.getElementById("text").textContent = t.text;
      document.title = "Laterna — " + t.title;
    }
    if (waitingMode) {
      document.getElementById("spinner").hidden = false;
      document.getElementById("retry").hidden = true;
      document.getElementById("waiting").hidden = true;
      document.getElementById("title").textContent = t.waitTitle;
      document.getElementById("text").textContent = t.waitText;
      document.title = "Laterna — " + t.waitTitle;
      fetch("/__sw/attente?url=" + encodeURIComponent(String(location.href).split("#")[0]), { cache: "no-store" })
        .then(function (res) {
          return res.json();
        })
        .then(function (body) {
          // `ready` : la réponse est là. `none` : le worker ne la tient plus (arrêté entre-temps) —
          // une nouvelle navigation est la seule façon de savoir. `failed` : pas de réseau.
          if (body && (body.state === "ready" || body.state === "none")) {
            reloading = true;
            location.reload();
          } else plainMode();
        })
        .catch(plainMode);
    }

    window.addEventListener("online", probe);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") probe();
    });
    // Le réseau peut revenir sans que le navigateur le dise (ou le serveur revenir sur un réseau
    // resté en place) : une sonde de temps en temps, tant que la page est visible.
    setInterval(function () {
      if (document.visibilityState === "visible") probe();
    }, 15000);
  })();
</script>
</body>
</html>
