<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Cine App — Hors ligne</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #020617;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    padding: 1.5rem;
    text-align: center;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  p { font-size: 0.85rem; color: #94a3b8; margin: 0; max-width: 24rem; }
  button {
    margin-top: 0.5rem;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #e2e8f0;
    border-radius: 0.5rem;
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Pas de connexion</h1>
    <p>Cine App n'a pas pu joindre le serveur. Vérifiez votre connexion réseau et réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
