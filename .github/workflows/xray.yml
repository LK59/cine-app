name: laterna-xray image

# Le service X-Ray vit dans xray/, avec son propre Dockerfile : il ne se reconstruit que quand
# ce dossier change. Les tests tournent dans la construction (étage `test`) ; aucun poids de
# modèle n'entre dans l'image.
on:
  push:
    branches: [main]
    paths:
      - "xray/**"
      - ".github/workflows/xray.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: xray
          push: true
          tags: |
            ghcr.io/lk59/laterna-xray:latest
            ghcr.io/lk59/laterna-xray:${{ github.sha }}
          cache-from: type=gha,scope=laterna-xray
          cache-to: type=gha,mode=max,scope=laterna-xray
