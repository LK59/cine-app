name: Build and publish Docker image

on:
  push:
    branches: [main]

jobs:
  # The gate: type-check, lint and tests. `needs` can only point at a job in this same file, so
  # the shared workflow is called here rather than relied on from its own trigger.
  verify:
    uses: ./.github/workflows/verify.yml

  build-and-push:
    runs-on: ubuntu-latest
    # Nothing is published unless the Verify workflow's checks pass on this same commit.
    needs: verify
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs `npm test` inside the build (see Dockerfile) — the build fails,
      # and nothing gets published, if a test breaks.
      - name: Short commit ref
        id: ref
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # The commit the image was built from, shown in the settings page (and naming the
          # service worker's cache generation) — without it the published image showed a
          # build timestamp instead. Short form, like a local `git rev-parse --short HEAD`.
          build-args: |
            BUILD_REF=${{ steps.ref.outputs.short }}
          tags: |
            ghcr.io/lk59/cine-app:latest
            ghcr.io/lk59/cine-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
